# ABOUTME: CI workflow - vet, unit tests, and build on every push and pull request.
# ABOUTME: Integration tests are not run in CI (require a live intervals.icu API key).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25.x", "1.26.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Unit tests (with race detector)
        run: go test -count=1 -race ./...

      - name: Build
        run: go build -o bin/intervals-icu-mcp .

      - name: Verify integration tag compiles
        run: go vet -tags=integration ./...
